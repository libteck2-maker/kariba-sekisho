<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>狩場の関所</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Reggae+One&family=Dela+Gothic+One&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d0c0b">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{--ink:#0d0c0b;--paper:#f2ecdf;--red:#d6301f;--navy:#17185a;--gold:#ffd23f;--verm:#ff4a2a;--cream:#fff3d6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);-webkit-tap-highlight-color:transparent}
body{--bg:#17185a;--panel:#fff3d6;--fg:#fff3d6;--tx:#0d0c0b;--acc:#ffd23f;--font:'DotGothic16',monospace;--shadow:6px 6px 0 #0d0c0b;font-family:var(--font);color:var(--fg);min-height:100vh;overflow-x:hidden}
body[data-world=geki]{--bg:#f2ecdf;--panel:#f2ecdf;--fg:#0d0c0b;--tx:#0d0c0b;--acc:#d6301f;--font:'Reggae One',serif;--shadow:7px 7px 0 #d6301f}
body[data-world=pixel]{background-image:linear-gradient(rgba(255,255,255,.04) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.04) 2px,transparent 2px);background-size:16px 16px}
button{font-family:inherit;cursor:pointer;color:inherit}
a{color:inherit}
#frame{position:relative;width:390px;height:844px;transform-origin:0 0}
#frameBox{position:relative;overflow:hidden}
.screen{max-width:480px;margin:0 auto;padding:16px 16px calc(84px + env(safe-area-inset-bottom))}
.h1{font-size:30px;margin:6px 0 14px;text-shadow:3px 3px 0 var(--verm),6px 6px 0 var(--ink)}
body[data-world=geki] .h1{text-shadow:none;font-size:34px}
.panel{position:relative;background:var(--panel);color:var(--tx);border:4px solid var(--ink);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.tag{position:absolute;left:10px;top:-14px;background:var(--verm);color:var(--cream);border:3px solid var(--ink);padding:1px 10px;font-size:13px}
body[data-world=geki] .tag{background:var(--ink);color:var(--paper)}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:64px;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);background:var(--gold);color:var(--ink);font-size:22px;margin-bottom:14px}
.btn small{font-size:12px}
.btn.sub{background:var(--cream)}
.btn.danger{background:var(--verm);color:var(--cream)}
body[data-world=geki] .btn{background:var(--ink);color:var(--paper);border:0;box-shadow:7px 7px 0 var(--red);font-size:26px}
body[data-world=geki] .btn.sub{background:var(--paper);color:var(--ink);border:5px solid var(--ink);box-shadow:none}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 12px;border:3px solid var(--ink);background:var(--cream);color:var(--ink);font-size:15px}
.chip.on{background:var(--gold)}
body[data-world=geki] .chip.on{background:var(--ink);color:var(--paper)}
.label{font-size:13px;margin:14px 0 6px;opacity:.85}
.panel .label{opacity:.7}
textarea,input[type=text],input[type=date],input[type=password]{width:100%;background:#fffdf6;border:3px solid var(--ink);color:var(--ink);font-family:inherit;font-size:16px;padding:10px;border-radius:0}
textarea{min-height:110px}
.timer{font-size:72px;text-align:center;letter-spacing:2px;text-shadow:4px 4px 0 var(--verm),8px 8px 0 var(--ink)}
.bar{height:16px;border:3px solid var(--ink);background:var(--ink);margin:10px 0}
.bar i{display:block;height:100%;background:var(--gold)}
.bar.over i{background:var(--verm)}
.card{background:var(--panel);color:var(--tx);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:12px;margin-bottom:12px}
.card.rot{opacity:.5}
.card h3{font-size:17px;font-weight:400;margin-bottom:6px}
.card p{font-size:13px;opacity:.8;word-break:break-all;margin-bottom:6px}
.card a{font-size:12px;color:#1f3a8a;word-break:break-all}
.kind{display:inline-block;font-size:12px;padding:1px 8px;border:2px solid var(--ink);margin-right:6px;background:var(--gold);color:var(--ink)}
.kind.k肉{background:#ff8f80}.kind.k素材{background:#9fd6ff}.kind.k未仕分け{background:#ddd}
.fresh{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:6px}
.fresh .bar{flex:1;height:10px;margin:0;border-width:2px}
.mini{padding:6px 10px;border:3px solid var(--ink);background:var(--gold);color:var(--ink);font-size:13px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--ink);padding:10px 0 calc(14px + env(safe-area-inset-bottom));z-index:5}
nav.tabs a{text-decoration:none;font-size:14px;color:#9a9ab8;padding:6px 10px}
nav.tabs a.on{color:var(--gold)}
body[data-world=geki] nav.tabs a{color:#b9b0a0}
body[data-world=geki] nav.tabs a.on{color:var(--paper);background:var(--red)}
.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:var(--ink);color:var(--cream);border:3px solid var(--cream);padding:10px 16px;font-size:15px;z-index:30;white-space:nowrap}
.sheet{position:fixed;inset:0;background:rgba(13,12,11,.6);z-index:20;display:flex;align-items:flex-end}
.sheet>div{width:100%;max-width:480px;margin:0 auto;background:var(--bg);border-top:5px solid var(--ink);padding:20px 16px calc(24px + env(safe-area-inset-bottom))}
body[data-world=pixel] .sheet>div{background:#17185a}
.result{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.result.bozu{isolation:isolate;background:var(--paper);color:var(--ink);font-family:'Reggae One',serif}
.result.bozu .big{font-size:150px;line-height:1;writing-mode:vertical-rl;color:var(--ink)}
.result.good{background:#17185a;color:var(--cream);font-family:'DotGothic16',monospace}
.result.good .big{font-size:64px;text-shadow:4px 4px 0 var(--verm),8px 8px 0 var(--ink)}
.result .pen{font-size:48px;color:var(--red)}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:2px dashed rgba(13,12,11,.25);font-size:15px}
</style>
</head>

      h.ended_at = new Date().toISOString(); h.penalty = pen; D.pt -= pen; save();
      return status({ result:{ bozu, mins, penalty:pen, catches:h.catches, ground:h.ground, mercy, overtime } }); },
    list_catches: () => D.catches.slice(0, 300),
    classify: a => { const c = D.catches.find(x => x.id === a.p_id); if (c){ c.kind = a.p_kind; if (a.p_title != null) c.title = a.p_title; if (a.p_deadline !== undefined) c.deadline = a.p_deadline; save(); } return status(); },
    cook: a => { const c = D.catches.find(x => x.id === a.p_id); if (c && !c.used){ c.used = true; D.pt += 3; save(); } return status(); },
    get_ticket: () => { if (D.pt >= TICKET){ D.pt -= TICKET; D.tickets += 1; save(); } return status(); },
    use_ticket: () => { if (D.tickets > 0){ D.tickets -= 1; save(); } return status(); },
    hunt_log: () => D.hunts.filter(h => h.ended_at).slice(-100).reverse(),
  };
})();

/* ---------- 画面 ---------- */
let S = null, view = 'gate', catches = [], bagTab = 'all', draft = { text:'', kind:'未仕分け', title:'', deadline:'' };
let pickGround = 'Instagram', pickStamina = 10, sheet = null, result = null, timerId = null, notice = null;
const q = new URLSearchParams(location.search);
if (q.get('gate') && GROUNDS.includes(q.get('gate'))) pickGround = q.get('gate');
if (q.get('catch')){ draft.text = q.get('catch'); view = 'catch'; }
if (q.get('view')) view = q.get('view');

function toast(m){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); }
function world(){ return S && S.stage >= 4 ? 'geki' : 'pixel'; }
function nav(){ const it = [['gate','関所'],['bag','獲物袋'],['catch','獲物を入れる'],['rules','掟']];
  return '<nav class="tabs">' + it.map(([k,l]) => '<a href="#" data-nav="' + k + '" class="' + (view === k || (k === 'gate' && view === 'hunt') ? 'on' : '') + '">' + l + '</a>').join('') + '</nav>'; }

function fitFrame(){ const f = $('#frame'); if (!f) return; const s = Math.min(Math.min(window.innerWidth, 480) / 390, window.innerHeight / 844);
  f.style.transform = 'scale(' + s + ')'; const b = $('#frameBox'); b.style.width = 390 * s + 'px'; b.style.height = 844 * s + 'px'; b.style.margin = '0 auto'; }

function vGate(){
  const tpl = document.getElementById('gate-' + Math.max(0, Math.min(4, S.stage)));
  const box = document.createElement('div'); box.id = 'frameBox';
  const fr = document.createElement('div'); fr.id = 'frame'; fr.appendChild(tpl.content.cloneNode(true)); box.appendChild(fr);
  const set = (sel, v) => fr.querySelectorAll(sel).forEach(e => e.textContent = v);
  set('.js-pt', String(S.pt).padStart(3, '0')); set('.js-back', String(S.today_turnbacks).padStart(2, '0')); set('.js-bozu', S.bozu_rate + '%');
  set('.js-ground', pickGround + '・' + pickStamina + '分');
  return box;
}
function vHunt(){
  const h = S.hunt;
  return '<div class="screen"><div class="h1">狩りの最中</div>' +
    '<div class="panel"><span class="tag">' + esc(h.ground) + '　スタミナ' + h.stamina_min + '分</span>' +
    '<div class="timer" id="tm">0:00</div><div class="bar" id="br"><i id="bi" style="width:0"></i></div><div id="tl" style="text-align:center;font-size:14px"></div>' +
    '<div style="text-align:center;font-size:26px;margin-top:12px">獲物 ' + h.catches + ' 匹</div></div>' +
    '<button class="btn" data-a="toCatch">獲物を入れる</button>' +
    (SCHEME[h.ground] ? '<a class="btn sub" style="text-decoration:none" href="' + SCHEME[h.ground] + '">狩場に戻る</a>' : '') +
    '<button class="btn ' + (h.catches ? 'sub' : 'danger') + '" data-a="endHunt">' + (h.catches ? '帰還する' : '帰還する<small>このままだと坊主</small>') + '</button></div>';
}
function vCatch(){
  return '<div class="screen"><div class="h1">獲物を入れる</div><div class="panel"><span class="tag">獲物</span>' +
    '<textarea id="tx" placeholder="投稿のリンクや文章">' + esc(draft.text) + '</textarea>' +
    '<div class="label">種類</div><div class="row">' + Object.keys(KIND).map(k => '<button class="chip' + (draft.kind === k ? ' on' : '') + '" data-k="' + k + '">' + k + '</button>').join('') + '</div>' +
    '<div class="label">見出し（なくてもOK）</div><input type="text" id="ti" value="' + esc(draft.title) + '">' +
    '<div class="label">締切（あれば）</div><input type="date" id="dl" value="' + esc(draft.deadline) + '"></div>' +
    '<button class="btn" data-a="saveCatch">仕留めた！</button></div>';
}
function fresh(c){ const k = KIND[c.kind] || KIND['未仕分け']; const t0 = new Date(c.created_at).getTime(); let end = t0 + k.life * 864e5;
  if (c.deadline){ const d = new Date(c.deadline + 'T23:59:59').getTime(); if (!isNaN(d)) end = d; }
  const left = end - Date.now(); return { ratio:Math.max(0, Math.min(1, left / Math.max(end - t0, 864e5))), days:Math.ceil(left / 864e5), rot:left <= 0 }; }
function vBag(){
  const tabs = ['all'].concat(Object.keys(KIND));
  let it = catches.filter(c => bagTab === 'all' || c.kind === bagTab);
  it = it.slice().sort((a, b) => (a.used - b.used) || (fresh(a).rot - fresh(b).rot) || (new Date(b.created_at) - new Date(a.created_at)));
  const link = t => { const m = String(t).match(/https?:\/\/\S+/); return m ? '<a href="' + esc(m[0]) + '" target="_blank" rel="noopener">' + esc(m[0].slice(0, 60)) + '</a>' : ''; };
  return '<div class="screen"><div class="h1">獲物袋</div><div class="row" style="margin-bottom:14px">' +
    tabs.map(t => '<button class="chip' + (bagTab === t ? ' on' : '') + '" data-t="' + t + '">' + (t === 'all' ? 'ぜんぶ' : t) + '</button>').join('') + '</div>' +
    (it.length ? it.map(c => { const f = fresh(c), k = KIND[c.kind] || KIND['未仕分け'];
      return '<div class="card' + (f.rot && !c.used ? ' rot' : '') + '"><h3><span class="kind k' + esc(c.kind) + '">' + esc(c.kind) + '</span>' + esc(c.title || String(c.text).replace(/https?:\/\/\S+/g, '').slice(0, 30) || '（無題）') + '</h3>' +
        '<p>' + esc(String(c.text).replace(/https?:\/\/\S+/g, '').slice(0, 120)) + '</p>' + link(c.text) +
        (c.kind === '未仕分け' && !c.used ? '<div class="row" style="margin-top:8px">' + ['お宝','肉','素材'].map(k2 => '<button class="mini" data-cls="' + c.id + '|' + k2 + '">' + k2 + '</button>').join('') + '</div>' : '') +
        (c.used ? '<div class="fresh">料理済み</div>' : '<div class="fresh"><span>' + (f.rot ? '腐った' : '鮮度 あと' + f.days + '日') + '</span><div class="bar' + (f.ratio < .3 ? ' over' : '') + '"><i style="width:' + Math.round(f.ratio * 100) + '%"></i></div>' + (f.rot ? '' : '<button class="mini" data-cook="' + c.id + '">' + k.verb + ' +3</button>') + '</div>') + '</div>'; }).join('')
      : '<div style="text-align:center;margin-top:40px">まだ獲物がない。</div>') + '</div>';
}
function vRules(){
  const pushLabel = !('PushManager' in window) ? 'この端末では通知を使えない' : (window.Notification && Notification.permission === 'granted') ? '通知オン（タップで登録を更新）' : '通知をオンにする';
  return '<div class="screen"><div class="h1">掟</div><div class="panel"><span class="tag">掟</span>' +
    [['引き返す','その日の1・3・6・10…回目で+1pt'],['同じ狩場の引き返し','10分あけないと数えない'],['獲物（お宝・肉）','+2pt'],['獲物（素材・未仕分け）','+1pt'],['料理した（話した・応募した・使った）','+3pt'],['坊主（獲物0で帰還）','5分ごとに −1pt'],['スタミナ超過','超えた5分ごとに −1pt'],['出猟から1分以内の帰還','ノーカウント'],[TICKET + 'pt','ガチャ券1枚']].map(r => '<div class="stat"><span>' + r[0] + '</span><span>' + r[1] + '</span></div>').join('') +
    '<p style="font-size:13px;margin-top:10px">坊主のたびに番人の機嫌が1段階悪くなり、画面が斬られる。獲物を制限時間内に持ち帰れば1段階戻る。制限時間を超えると機嫌が悪くなるが、たまに番人が見逃してくれる（機嫌が最悪のときは見逃してくれない）。</p></div>' +
    '<div class="panel"><span class="tag">いま</span>' + [['狩猟pt', S.pt],['番人の機嫌', S.stage + ' / 4'],['ガチャ券', S.tickets + '枚'],['坊主率（直近30回）', S.bozu_rate + '%']].map(r => '<div class="stat"><span>' + r[0] + '</span><span>' + r[1] + '</span></div>').join('') + '</div>' +
    (S.pt >= TICKET ? '<button class="btn" data-a="getTicket">' + TICKET + 'ptでガチャ券と交換</button>' : '') +
    (S.tickets ? '<button class="btn sub" data-a="useTicket">ガチャ券を使った（本物を1回）</button>' : '') +
    '<div class="panel"><span class="tag">接続</span><div style="font-size:14px">' + (remote ? 'Supabaseにつながる設定' : '端末内モード（Supabase未設定）') + '</div>' +
    (remote ? '<div class="label">合言葉（ショートカットと同じもの）</div><input type="password" id="sec" value="' + esc(LS.get('kariba-secret') || '') + '"><button class="btn sub" style="margin-top:12px;margin-bottom:0" data-a="saveSecret">保存</button>' : '') + '</div>' +
    (remote ? '<div class="panel"><span class="tag">通知</span><div style="font-size:14px">スタミナ切れから5分ごとに通知する</div><button class="btn sub" style="margin-top:12px;margin-bottom:0" data-a="pushOn">' + pushLabel + '</button></div>' : '') + '</div>';
}
function vSheet(){
  return '<div class="sheet" data-a="closeSheet"><div><div class="h1" style="font-size:24px">出猟の支度</div>' +
    '<div class="label">狩場</div><div class="row">' + GROUNDS.map(g => '<button class="chip' + (pickGround === g ? ' on' : '') + '" data-g="' + g + '">' + g + '</button>').join('') + '</div>' +
    '<div class="label">スタミナ</div><div class="row">' + [5,10,15,30].map(m => '<button class="chip' + (pickStamina === m ? ' on' : '') + '" data-m="' + m + '">' + m + '分</button>').join('') + '</div>' +
    '<div style="height:18px"></div><button class="btn" data-a="startHunt">出猟！</button><button class="btn sub" data-a="closeSheet">やめる</button></div></div>';
}
function vResult(){
  const r = result;
  if (r.void) return '<div class="result good" data-a="closeResult"><div class="big">帰還</div><div style="font-size:22px">短すぎて、狩りにならなかった。</div><div style="font-size:18px;color:#ffd23f">ノーカウント</div><div style="font-size:14px">（タップで関所へ）</div></div>';
  if (r.bozu) return '<div class="result bozu" data-a="closeResult"><div style="position:absolute;inset:0;overflow:hidden;z-index:-1">' + document.getElementById('bozu-bg').innerHTML + '</div><div class="big" style="filter:url(#rough);padding:10px">坊主</div><div style="font-size:22px">' + r.mins + '分を、森に捨てた。</div><div class="pen" style="border:6px solid #d6301f;background:#f2ecdf;padding:4px 16px;transform:rotate(-8deg)">−' + r.penalty + '</div><div style="font-size:14px;background:#f2ecdf;padding:2px 8px">（タップで関所へ）</div></div>';
  return '<div class="result good" data-a="closeResult"><div class="big">帰還</div><div style="font-size:22px">獲物 ' + r.catches + ' 匹を持ち帰った（' + r.mins + '分）</div>' + (r.penalty ? '<div class="pen">時間オーバー −' + r.penalty + '</div>' : '') + (r.mercy ? '<div style="font-size:18px;color:#ffd23f">番人が見逃してくれた。機嫌が少し直った</div>' : r.overtime ? '<div style="font-size:18px;color:#d6301f">時間オーバーで番人の機嫌が悪化した</div>' : '<div style="font-size:18px;color:#ffd23f">番人の機嫌が少し直った</div>') + '<div style="font-size:14px">（タップで関所へ）</div></div>';
}
function vNotice(){
  return '<div class="result good" data-a="closeNotice"><div class="big" style="font-size:44px">' + esc(notice.t) + '</div><div style="font-size:19px;line-height:1.6">' + esc(notice.s) + '</div><div style="font-size:14px">（タップで関所へ）</div></div>';
}
function render(){
  if (!S) return;
  if (view === 'gate' && S.hunting) view = 'hunt';
  if (view === 'hunt' && !S.hunting) view = 'gate';
  document.body.dataset.world = world();
  const app = $('#app'); app.innerHTML = '';
  if (view === 'gate'){ app.appendChild(vGate()); fitFrame(); }
  else { app.innerHTML = ({ hunt:vHunt, catch:vCatch, bag:vBag, rules:vRules }[view] || vCatch)() + nav(); }
  if (sheet) app.insertAdjacentHTML('beforeend', vSheet());
  if (result) app.insertAdjacentHTML('beforeend', vResult());
  if (notice) app.insertAdjacentHTML('beforeend', vNotice());
  tick();
}
function tick(){ if (!S || !S.hunt || !$('#tm')) return;
  const sec = Math.floor((Date.now() - new Date(S.hunt.started_at)) / 1000), lim = S.hunt.stamina_min * 60;
  $('#tm').textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  $('#bi').style.width = Math.min(100, sec / lim * 100) + '%'; $('#br').className = 'bar' + (sec > lim ? ' over' : '');
  $('#tl').textContent = sec > lim ? 'スタミナ切れ。獲物を持って帰れ' : '残り ' + Math.ceil((lim - sec) / 60) + '分'; }
setInterval(tick, 1000);
window.addEventListener('resize', fitFrame);

async function act(fn, args, after){
  try { const r = await rpc(fn, args); if (r && typeof r.pt === 'number') S = r; if (after) after(r); render(); }
  catch(e){ toast('つながらなかった：' + e.message); }
}
const ACT = {
  back: () => act('turn_back', { p_ground:pickGround }, r => { notice = r && r.too_soon
    ? { t:'番人が見ている', s:'さっき引き返したばかりだ。同じ狩場の引き返しは、10分あけないと数えない。' }
    : { t:'引き返した', s:((r && r.added_pt) ? '+1pt。' : '') + 'ホームに戻って、別のことをしよう。' }; }),
  closeNotice: () => { notice = null; render(); },
  hunt: () => { sheet = 'hunt'; render(); },
  closeSheet: () => { sheet = null; render(); },
  startHunt: () => act('start_hunt', { p_ground:pickGround, p_stamina:pickStamina }, () => { sheet = null; if (SCHEME[pickGround]) setTimeout(() => { location.href = SCHEME[pickGround]; }, 300); }),
  endHunt: () => act('end_hunt', {}, r => { if (r.result) result = r.result; view = 'gate'; }),
  closeResult: () => { result = null; render(); },
  toCatch: () => { view = 'catch'; render(); },
  saveCatch: () => { if (!draft.text.trim()) return toast('獲物が空っぽ');
    act('add_catch', { p_text:draft.text.trim(), p_kind:draft.kind, p_title:draft.title || null, p_deadline:draft.deadline || null }, r => {
      toast('仕留めた！ +' + (r.added_pt || KIND[draft.kind].pt) + 'pt'); draft = { text:'', kind:'未仕分け', title:'', deadline:'' };
      try{ history.replaceState(null, '', location.pathname); }catch(e){}
      view = S.hunting ? 'hunt' : 'bag'; if (view === 'bag') loadBag(); }); },
  getTicket: () => act('get_ticket', {}, () => toast('ガチャ券ゲット！本物のガチャを1回まわしてよし')),
  useTicket: () => act('use_ticket', {}, () => toast('景品は基地の壁へ')),
  saveSecret: () => { LS.set('kariba-secret', ($('#sec') || {}).value || ''); toast('保存した'); boot(); },
  pushOn: () => { enablePush().then(ok => { toast(ok ? '通知を登録した' : '登録失敗 ' + pushErr); render(); }); },
};
async function loadBag(){ try { catches = await rpc('list_catches', {}) || []; } catch(e){ toast('獲物袋を開けなかった'); } render(); }
document.addEventListener('input', e => { if (e.target.id === 'tx') draft.text = e.target.value; if (e.target.id === 'ti') draft.title = e.target.value; if (e.target.id === 'dl') draft.deadline = e.target.value; });
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a],[data-act],[data-nav],[data-g],[data-m],[data-k],[data-t],[data-cook],[data-cls]'); if (!el) return;
  const d = el.dataset;
  if (d.nav){ e.preventDefault(); view = d.nav; if (view === 'bag') loadBag(); else render(); window.scrollTo(0, 0); return; }
  if (d.act && ACT[d.act]) return ACT[d.act]();
  if (d.a && ACT[d.a]){ if (d.a === 'closeSheet' && e.target !== el) return; return ACT[d.a](); }
  if (d.g){ pickGround = d.g; return render(); }
  if (d.m){ pickStamina = +d.m; return render(); }
  if (d.k){ draft.kind = d.k; return render(); }
  if (d.t){ bagTab = d.t; return render(); }
  if (d.cook) return act('cook', { p_id:d.cook }, () => { toast('料理完成 +3pt'); loadBag(); });
  if (d.cls){ const [id, k] = d.cls.split('|'); return act('classify', { p_id:id, p_kind:k }, () => loadBag()); }
});
function urlB64ToUint8(b){ const pad = '='.repeat((4 - b.length % 4) % 4); const raw = atob((b + pad).replace(/-/g, '+').replace(/_/g, '/')); const arr = new Uint8Array(raw.length); for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i); return arr; }
let pushErr = '';
async function enablePush(){
  if (!remote || !('serviceWorker' in navigator) || !('PushManager' in window)){ pushErr = '非対応'; return false; }
  let stage = 'sw';
  try {
    await navigator.serviceWorker.register('sw.js');
    stage = '許可';
    const perm = await Notification.requestPermission();
    if (perm !== 'granted'){ pushErr = '許可:' + perm; return false; }
    stage = 'sw準備';
    const reg = await navigator.serviceWorker.ready;
    stage = '購読';
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8(CONFIG.VAPID_PUBLIC_KEY) });
    stage = '鍵';
    const j = sub.toJSON();
    if (!j || !j.keys){ pushErr = '鍵なし'; return false; }
    stage = '送信';
    await rpc('register_push', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
    pushErr = '';
    return true;
  } catch (e) { pushErr = stage + ':' + (e && e.name ? e.name : 'Error'); return false; }
}
function initPush(){
  if (!remote || !('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('sw.js').catch(() => {});
  if (window.Notification && Notification.permission === 'granted' && LS.get('kariba-secret')) enablePush();
}
async function boot(){
  try { S = await rpc('hunt_status', {}); }
  catch(e){ S = { hunting:false, hunt:null, pt:0, stage:0, tickets:0, today_turnbacks:0, bozu_rate:0 }; toast('つながらなかった：' + e.message); }
  if (q.get('return') && S.hunting){ return act('end_hunt', {}, r => { if (r.result) result = r.result; view = 'gate'; }); }
  if (view === 'bag') return loadBag();
  render();
}
boot();
initPush();
})();
</script>
